// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // @capgo/capacitor-social-login declares androidx.browser:browser:1.9.0
    // (its Apple provider branch) while com.google.androidbrowserhelper:2.5.0
    // pulls androidx.browser:browser:1.4.0. Gradle's consistent resolution
    // cannot satisfy both, so force the newer version everywhere.
    configurations.configureEach {
        resolutionStrategy {
            force 'androidx.browser:browser:1.9.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
